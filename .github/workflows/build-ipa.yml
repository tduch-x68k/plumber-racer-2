name: Build MKW IPA (Apple Silicon)

on:
  workflow_dispatch:  # manual trigger only

jobs:
  build:
    runs-on: xcode-27        # Apple Silicon, macOS 27 + Xcode 27 toolchain
    timeout-minutes: 360     # shader compilation can take a while

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Show environment
      run: |
        uname -m
        sw_vers
        xcode-select -p
        xcrun --sdk iphoneos --show-sdk-version || true
        xcrun -sdk iphoneos metal --version || true

    - name: Verify Xcode 27
      run: |
        xcodebuild -version
        xcrun -sdk iphoneos metal --version
        echo "Metal compiler arch: $(file $(xcrun -sdk iphoneos -f metal))"

    - name: Install iOS platform
      run: |
        if ! xcrun --sdk iphoneos --show-sdk-version 2>/dev/null; then
          xcodebuild -downloadPlatform iOS
        fi
        echo "iOS SDK version:"
        xcrun --sdk iphoneos --show-sdk-version

    - name: Install build tools
      run: |
        brew install xcodegen glslang zstd
        pip3 install --break-system-packages lz4 "capstone>=5,<6" fonttools "backports.zstd"

    - name: Install .NET SDK
      run: |
        brew install --cask dotnet-sdk || true
        dotnet --version || true

    - name: Download game dump
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p ~/Games/MarioKartWorld ~/Games/parts

        echo "Downloading split archives from release..."
        gh release download game-dump -R ${{ github.repository }} -D ~/Games/parts/

        echo "Downloaded parts:"
        ls -lh ~/Games/parts/

        echo "Reassembling..."
        cat ~/Games/parts/mkw.part.* > ~/Games/mkw.tar.zst

        echo "Archive size:"
        ls -lh ~/Games/mkw.tar.zst

        echo "Extracting..."
        zstd -d ~/Games/mkw.tar.zst --stdout | tar xf - -C ~/Games/MarioKartWorld

        rm -rf ~/Games/parts ~/Games/mkw.tar.zst

        echo "=== Game dump contents ==="
        ls -la ~/Games/MarioKartWorld/
        du -sh ~/Games/MarioKartWorld/

    - name: Build IPA
      run: |
        python3 scripts/build_ipa_from_nsp.py ~/Games/MarioKartWorld \
          --platform ios \
          --romfs separate \
          -o ~/MarioKartWorld.ipa

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: MarioKartWorld-IPA
        path: ~/MarioKartWorld.ipa
        retention-days: 7

    - name: Upload romfs separately
      uses: actions/upload-artifact@v4
      with:
        name: MarioKartWorld-romfs
        path: ~/Games/MarioKartWorld/romfs.img
        if-no-files-found: ignore
        retention-days: 7

    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          build/
          *.log
        retention-days: 3
