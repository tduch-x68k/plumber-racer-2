name: Build MKW IPA (Apple Silicon)

on:
  workflow_dispatch:  # manual trigger only

jobs:
  build:
    runs-on: xcode-27        # Apple Silicon, macOS 27 + Xcode 27 toolchain
    timeout-minutes: 360     # shader compilation can take a while

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Show environment
      run: |
        uname -m
        sw_vers
        xcode-select -p
        xcrun --sdk iphoneos --show-sdk-version || true
        xcrun -sdk iphoneos metal --version || true

    - name: Verify Xcode 27
      run: |
        xcodebuild -version
        xcrun -sdk iphoneos metal --version
        echo "Metal compiler arch: $(file $(xcrun -sdk iphoneos -f metal))"

    - name: Install iOS platform
      run: |
        if ! xcrun --sdk iphoneos --show-sdk-version 2>/dev/null; then
          xcodebuild -downloadPlatform iOS
        fi
        echo "iOS SDK version:"
        xcrun --sdk iphoneos --show-sdk-version

    - name: Install build tools
      run: |
        brew install xcodegen glslang zstd
        pip3 install --break-system-packages lz4 "capstone>=5,<6" fonttools
        # backports.zstd only needed on Python <3.14 (3.14+ has zstd built in)
        pip3 install --break-system-packages "backports.zstd" 2>/dev/null || echo "Skipping backports.zstd (Python 3.14+ has native zstd)"

    - name: Install .NET SDK
      run: |
        brew install --cask dotnet-sdk || true
        dotnet --version || true

    - name: Free disk space
      run: |
        echo "Before cleanup:"
        df -h /
        # Remove stuff we don't need
        sudo rm -rf /Library/Developer/CoreSimulator/Volumes/* 2>/dev/null || true
        sudo rm -rf ~/Library/Developer/CoreSimulator 2>/dev/null || true
        sudo rm -rf /usr/local/share/powershell 2>/dev/null || true
        sudo rm -rf /usr/local/lib/node_modules 2>/dev/null || true
        sudo rm -rf ~/.dotnet 2>/dev/null || true
        sudo rm -rf /usr/local/share/chromium 2>/dev/null || true
        sudo rm -rf /usr/local/share/edge 2>/dev/null || true
        echo "After cleanup:"
        df -h /

    - name: Download game dump
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p ~/Games/MarioKartWorld ~/Games/parts

        echo "Disk space:"
        df -h /

        echo "Downloading split archives from release..."
        gh release download game-dump -R ${{ github.repository }} -D ~/Games/parts/

        echo "Downloaded parts:"
        ls -lh ~/Games/parts/

        echo "Extracting directly from parts (no reassembly to save space)..."
        cat ~/Games/parts/mkw.part.* | zstd -d --stdout | tar xf - -C ~/Games/MarioKartWorld

        echo "Removing parts immediately..."
        rm -rf ~/Games/parts

        echo "Disk space after extract:"
        df -h /

        echo "=== Game dump contents ==="
        ls -la ~/Games/MarioKartWorld/
        du -sh ~/Games/MarioKartWorld/

    - name: Build IPA
      run: |
        python3 scripts/build_ipa_from_nsp.py ~/Games/MarioKartWorld \
          --platform ios \
          --romfs separate \
          -o ~/MarioKartWorld.ipa

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: MarioKartWorld-IPA
        path: ~/MarioKartWorld.ipa
        retention-days: 7

    - name: Upload romfs separately
      uses: actions/upload-artifact@v4
      with:
        name: MarioKartWorld-romfs
        path: ~/Games/MarioKartWorld/romfs.img
        if-no-files-found: ignore
        retention-days: 7

    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          build/
          *.log
        retention-days: 3
